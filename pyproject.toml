[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "score7"
version = "0.1.0"
description = "Harmonic and sonic analysis of audio files — key, chord grid, structure, spectral, melody. CLI + MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Marc Verchiani", email = "flux7art@gmail.com" },
]
dependencies = [
    "fastmcp>=2.0",
    "librosa>=0.10",
    "numpy>=1.23",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    "pretty_midi>=0.2",
]

# Étapes lourdes (séparation de stems + transcription) — opt-in :
#   pip install score7[melody]
[project.optional-dependencies]
melody = [
    "demucs>=4.0",
    "piano_transcription_inference>=0.0.6",
]
# Beat/downbeat tracking neuronal (BPM + métrique fiables). Priorité Beat This! (transformer,
# ISMIR 2024, état de l'art, PyTorch — torch déjà tiré par [melody]) puis madmom (RNN+DBN).
# madmom PyPI 0.16.1 cassé sur Python 3.12 — installer depuis git :
#   pip install "madmom @ git+https://github.com/CPJKU/madmom.git"
rhythm = [
    "beat-this>=1.1",
    "madmom>=0.17.dev0",
]
test = ["pytest>=8.0"]

[project.scripts]
score7 = "score7_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# code tiers vendorisé (BTC) : conservé tel quel pour fidélité au modèle, hors lint
extend-exclude = ["score7_mcp/_btc"]

[tool.setuptools.packages.find]
include = ["score7_mcp*"]

# Fichiers non-Python du sous-ensemble BTC vendorisé (config + licence MIT)
[tool.setuptools.package-data]
"score7_mcp._btc" = ["*.yaml", "LICENSE"]
